<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>초능력 대전</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #000;
    color: #fff;
    font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 60px;
  }
  h1 {
    font-size: 36px;
    font-weight: 700;
    margin-bottom: 32px;
  }
  .menu {
    display: grid;
    grid-template-columns: 254px 254px;
    column-gap: 16px;
    row-gap: 12px;
  }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 52px;
    background: #000;
    color: #fff;
    border: 1px solid #fff;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    font-family: inherit;
  }
  .btn:hover { background: #fff; color: #000; }
  .btn.start {
    height: 140px;
    font-size: 30px;
    border-width: 2px;
    border-radius: 14px;
  }
  .btn.start + .btn { margin-top: 0; }

  /* 화면 전환 패널 */
  #panel {
    display: none;
    width: 540px;
    max-width: 100%;
    margin-top: 32px;
    border: 1px solid #fff;
    border-radius: 14px;
    padding: 28px;
    text-align: center;
  }
  #panel.show { display: block; }
  #panel h2 { font-size: 24px; margin-bottom: 16px; }
  #panel p { color: #bbb; line-height: 1.6; margin-bottom: 20px; }
  #panel .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  #panel .btn { width: 160px; height: 44px; font-size: 15px; }
  #panel input {
    width: 100%; height: 44px; margin-bottom: 14px;
    background: #000; color: #fff; border: 1px solid #888; border-radius: 8px;
    padding: 0 12px; font-family: inherit; font-size: 15px;
  }
  #toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: #fff; color: #000; padding: 10px 18px; border-radius: 8px;
    font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  #toast.show { opacity: 1; }

  #scare {
    position: fixed; inset: 0; background: #000; z-index: 9999;
    display: none; align-items: center; justify-content: center; overflow: hidden;
  }
  #scare.show { display: flex; }
  #scare img { max-width: 90vw; max-height: 90vh; object-fit: contain; }
  /* 2) 깜빡임 */
  #scare.flicker img { animation: flicker .16s steps(1) 5; }
  @keyframes flicker { 0% {opacity:1} 50% {opacity:0.05} 100% {opacity:1} }
  /* 3) 흔들림 */
  #scare.shake { animation: shake .09s linear infinite; }
  @keyframes shake {
    0% {transform: translate(0,0)} 25% {transform: translate(-8px,4px)}
    50% {transform: translate(7px,-5px)} 75% {transform: translate(-4px,-7px)}
    100% {transform: translate(0,0)}
  }
  /* 4) 확대: 화면 앞으로 튀어나오듯 */
  #scare.zoom img { animation: zoomIn .35s cubic-bezier(.1,.9,.2,1) both; }
  @keyframes zoomIn { from {transform: scale(.35)} to {transform: scale(1)} }
</style>
</head>
<body>

<h1>초능력 대전</h1>

<div class="menu" id="menu">
  <div class="col">
    <button class="btn start" data-action="시작">시작</button>
    <button class="btn" data-action="스킬 커스텀">스킬 커스텀</button>
    <button class="btn" data-action="스킬 설정">스킬 설정</button>
    <button class="btn" data-action="이모티콘">이모티콘</button>
    <button class="btn" data-action="캐릭터 설정">캐릭터 설정</button>
    <button class="btn" data-action="키 설정">키 설정</button>
  </div>
  <div class="col">
    <button class="btn" data-action="유저 검색">유저 검색</button>
    <button class="btn" data-action="친구">친구</button>
    <button class="btn" data-action="메시지">메시지</button>
    <button class="btn" data-action="패치노트">패치노트</button>
    <button class="btn" data-action="커뮤니티">커뮤니티</button>
    <button class="btn" data-action="랭크">랭크</button>
    <button class="btn" data-action="명예의 전당">명예의 전당</button>
    <button class="btn" data-action="관리">관리</button>
  </div>
</div>

<div id="panel">
  <h2 id="panelTitle"></h2>
  <div id="panelBody"></div>
  <div class="row" style="margin-top:20px;">
    <button class="btn" id="backBtn">뒤로</button>
  </div>
</div>

<div id="toast"></div>

<script>
  const panel = document.getElementById('panel');
  const panelTitle = document.getElementById('panelTitle');
  const panelBody = document.getElementById('panelBody');
  const toast = document.getElementById('toast');

  const content = {
    '시작': `<p>게임 모드를 선택하세요.</p>
      <div class="row">
        <button class="btn" data-go="빠른 대전">빠른 대전</button>
        <button class="btn" data-go="방 만들기">방 만들기</button>
        <button class="btn" data-go="방 찾기">방 찾기</button>
      </div>`,
    '방 찾기': `<p>참여 가능한 방 목록입니다. 현재 열린 방이 없습니다.</p>`,
    '방 만들기': `<input placeholder="방 제목을 입력하세요">
      <div class="row"><button class="btn" data-toast="방이 생성되었습니다.">만들기</button></div>`,
    '빠른 대전': `<p>상대를 찾는 중입니다...</p>
      <div class="row"><button class="btn" data-toast="매칭을 취소했습니다.">매칭 취소</button></div>`,
    'AI전': `<p>AI 상대와 대전합니다.</p>
      <div class="row"><button class="btn" data-toast="AI 대전을 시작합니다.">AI 대전 시작</button></div>`,
    '스킬 커스텀': `<p>보유한 스킬을 조합해 나만의 스킬 세트를 만드세요.</p>
      <div class="row"><button class="btn" data-toast="스킬 세트가 저장되었습니다.">저장</button></div>`,
    '스킬 설정': `<p>대전에서 사용할 스킬을 선택하세요.</p>
      <div class="row"><button class="btn" data-toast="스킬 설정이 저장되었습니다.">저장</button></div>`,
    '이모티콘': `<p>대전 중 사용할 이모티콘을 최대 5개까지 선택할 수 있습니다.</p>
      <div class="row"><button class="btn" data-toast="이모티콘 설정이 저장되었습니다.">저장</button></div>`,
    '캐릭터 설정': `<p>캐릭터 외형과 이름을 설정합니다.</p>
      <input placeholder="캐릭터 이름">
      <div class="row"><button class="btn" data-toast="캐릭터 설정이 저장되었습니다.">저장</button></div>`,
    '키 설정': `<p>키 설정 — 스킬 슬롯: J · K · L · ;<br>궁극기: P · 특수 스킬: 스페이스바</p>
      <div class="row"><button class="btn" data-toast="기본 키로 초기화했습니다.">기본값 복원</button></div>`,
    '유저 검색': `<input placeholder="닉네임을 입력하세요">
      <div class="row"><button class="btn" data-toast="검색 결과가 없습니다.">검색</button></div>`,
    '친구': `<p>등록된 친구가 없습니다.</p>`,
    '메시지': `<p>받은 메시지가 없습니다.</p>`,
    '패치노트': `<p>최신 패치노트를 확인하세요.</p>`,
    '커뮤니티': `<p>게시글 목록을 불러오는 중입니다.</p>
      <div class="row"><button class="btn" data-toast="게시글 작성 화면은 준비 중입니다.">글쓰기</button></div>`,
    '랭크': `<p>현재 시즌 랭킹을 확인합니다.</p>`,
    '명예의 전당': `<p>시즌 우승자 기록이 여기에 표시됩니다.</p>`,
    '관리': `<p>관리자 메뉴입니다.</p>
      <div class="row">
        <button class="btn" data-toast="점수가 초기화되었습니다.">점수 초기화</button>
        <button class="btn" data-toast="랭킹전 일정 화면으로 이동합니다.">랭킹전 일정</button>
        <button class="btn" data-toast="커뮤니티 활동 금지 처리되었습니다.">활동 금지</button>
        <button class="btn" data-toast="신고 목록을 불러왔습니다.">신고 관리</button>
        <button class="btn" data-toast="전체 유저 목록을 불러왔습니다.">전체 유저 조회</button>
      </div>`
  };

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast.t);
    showToast.t = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  function openPanel(title) {
    panelTitle.textContent = title;
    panelBody.innerHTML = content[title] || `<p>${title} 화면입니다.</p>`;
    panel.classList.add('show');
    panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  document.getElementById('menu').addEventListener('click', e => {
    const btn = e.target.closest('[data-action]');
    if (btn) openPanel(btn.dataset.action);
  });

  panelBody.addEventListener('click', e => {
    const go = e.target.closest('[data-go]');
    const toastBtn = e.target.closest('[data-toast]');
    if (go) openPanel(go.dataset.go);
    else if (toastBtn) showToast(toastBtn.dataset.toast);
  });

  document.getElementById('backBtn').addEventListener('click', () => {
    panel.classList.remove('show');
    document.querySelector('.menu').scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
</script>

<script>
  (function () {
    const scareEl = document.getElementById('scare');
    const aud = document.getElementById('scareAud');
    let timers = [];
    function clearAll() { timers.forEach(clearTimeout); timers = []; }

    function scare() {
      clearAll();
      scareEl.className = '';
      void scareEl.offsetWidth;
      scareEl.classList.add('show', 'zoom', 'flicker', 'shake');
      aud.currentTime = 0;
      aud.play().catch(() => {});

      // 2초 후 원래 메뉴로 복귀
      timers.push(setTimeout(() => {
        scareEl.className = '';
        aud.pause();
        document.getElementById('panel').classList.remove('show');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, 2000));
    }

    document.addEventListener('click', e => {
      if (e.target.closest('button')) {
        e.stopPropagation();
        e.preventDefault();
        scare();
      }
    }, true);
  })();
</script>
